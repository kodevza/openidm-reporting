repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm exec --no -- eslint --no-warn-ignored --
        language: system
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^(?:assets|coverage)/
